name: VibeCleaner
description: >-
  Scan a repository for security holes and AI-generated code slop.
  On pull_request, an empty diff-base scans origin/<base ref>; otherwise
  an empty diff-base is a full scan. Checkout must use fetch-depth: 0.

inputs:
  path:
    description: Directory to scan
    required: false
    default: "."
  diff-base:
    description: >-
      Git ref passed to vibecleaner --diff. Empty on pull_request means
      origin/${{ github.base_ref }}; empty on any other event means a full scan.
    required: false
    default: ""
  mode:
    description: "Scan mode: auto, live, offline, or off"
    required: false
    default: auto
  threshold:
    description: Layer 2 probability threshold (0.01 through 0.99)
    required: false
    default: "0.75"
  fail-on:
    description: "Fail when a finding is at or above this severity: critical, high, medium, low, or none"
    required: false
    default: high
  sarif:
    description: SARIF output path
    required: false
    default: vibecleaner.sarif
  gemini-api-key:
    description: >-
      Optional Gemini API key. Exported as GEMINI_API_KEY only when non-empty.
      auto mode uses the offline heuristic when no key is set.
    required: false
    default: ""
  python-version:
    description: Python version for actions/setup-python
    required: false
    default: "3.12"
  upload-sarif:
    description: Upload the SARIF file with github/codeql-action/upload-sarif when true
    required: false
    default: "true"
  min-test-score:
    description: Optional minimum test-coverage audit score (0 disables the check, 1..100 enforces `vibecleaner tests`)
    required: false
    default: "0"

outputs:
  exit-code:
    description: vibecleaner process exit code (0 pass, 1 findings, 2 error)
    value: ${{ steps.scan.outputs.exit_code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install VibeCleaner
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: pip install "$ACTION_PATH"

    - name: Fetch pull request base
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        # actions/checkout must use fetch-depth: 0 so origin/$BASE_REF exists.
        # This fetch is the fallback when that base commit was not downloaded.
        if [ -z "$BASE_REF" ]; then
          echo "pull_request event is missing github.base_ref" >&2
          exit 2
        fi
        git fetch --no-tags origin "$BASE_REF"

    - name: Run VibeCleaner
      id: scan
      shell: bash
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_DIFF_BASE: ${{ inputs.diff-base }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_THRESHOLD: ${{ inputs.threshold }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_GEMINI_API_KEY: ${{ inputs.gemini-api-key }}
        INPUT_MIN_TEST_SCORE: ${{ inputs.min-test-score }}
        EVENT_NAME: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_GEMINI_API_KEY" ]; then
          export GEMINI_API_KEY="$INPUT_GEMINI_API_KEY"
        fi
        args=(
          scan
          "$INPUT_PATH"
          --mode "$INPUT_MODE"
          --threshold "$INPUT_THRESHOLD"
          --fail-on "$INPUT_FAIL_ON"
          --sarif "$INPUT_SARIF"
          --report VIBECLEANER_REPORT.md
        )
        diff_base="$INPUT_DIFF_BASE"
        if [ -z "$diff_base" ] && [ "$EVENT_NAME" = "pull_request" ] && [ -n "$BASE_REF" ]; then
          diff_base="origin/${BASE_REF}"
        fi
        if [ -n "$diff_base" ]; then
          args+=(--diff "$diff_base")
        fi
        set +e
        vibecleaner "${args[@]}"
        code=$?
        if [ "$code" -eq 0 ] && [ "${INPUT_MIN_TEST_SCORE:-0}" -gt 0 ] 2>/dev/null; then
          test_args=(tests "$INPUT_PATH" --min-score "$INPUT_MIN_TEST_SCORE" --no-report)
          if [ -n "$diff_base" ]; then
            test_args+=(--diff "$diff_base")
          fi
          vibecleaner "${test_args[@]}"
          code=$?
        fi
        set -e
        printf 'exit_code=%s\n' "$code" >> "$GITHUB_OUTPUT"
        if [ -n "${RUNNER_TEMP:-}" ]; then
          printf '%s\n' "$code" > "$RUNNER_TEMP/vibecleaner-exit-code"
        fi
        if [ -f VIBECLEANER_REPORT.md ]; then
          {
            printf '\n'
            cat VIBECLEANER_REPORT.md
          } >> "$GITHUB_STEP_SUMMARY"
        fi
        exit 0

    - name: Upload SARIF
      if: always() && inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v3
      continue-on-error: true
      with:
        sarif_file: ${{ inputs.sarif }}

    - name: Enforce VibeCleaner result
      if: always()
      shell: bash
      env:
        SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
      run: |
        set -euo pipefail
        code="${SCAN_EXIT}"
        if [ -z "$code" ] && [ -n "${RUNNER_TEMP:-}" ] && [ -f "$RUNNER_TEMP/vibecleaner-exit-code" ]; then
          code="$(cat "$RUNNER_TEMP/vibecleaner-exit-code")"
        fi
        case "$code" in
          0)
            exit 0
            ;;
          1|2)
            echo "VibeCleaner exited ${code}" >&2
            exit "$code"
            ;;
          *)
            echo "VibeCleaner did not report a pass (exit ${code:-unset})" >&2
            exit 2
            ;;
        esac
